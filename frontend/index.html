<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scalper</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f141b;--card:#18212b;--line:#26323f;--tx:#dde5ee;--mut:#8796a6;--up:#4fd1a1;--dn:#ff7d6e;--amb:#f4b942}
*{box-sizing:border-box}
body{margin:0 auto;max-width:760px;padding:12px;background:var(--bg);color:var(--tx);font:15px/1.4 "IBM Plex Sans",system-ui,sans-serif}
.num,td,pre{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
header{display:flex;gap:8px;align-items:center;margin-bottom:12px}
header b{font-size:18px;flex:1}
.tag{padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px}
.tag.live{border-color:var(--dn);color:var(--dn)}.tag.on{border-color:var(--up);color:var(--up)}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid div span{display:block;color:var(--mut);font-size:13px}.grid div b{font-size:19px}
.up{color:var(--up)}.dn{color:var(--dn)}
button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
#arm{width:100%;padding:18px;font-size:18px;font-weight:600;margin-bottom:12px;border-width:2px}
#arm.on{background:var(--amb);color:#1a1300;border-color:var(--amb)}
label{display:block;color:var(--mut);font-size:13px}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}form .w{grid-column:1/-1}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th{color:var(--mut);font-weight:400;text-align:right;padding:4px 8px}td{text-align:right;padding:6px 8px;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
pre{margin:0;height:220px;overflow:auto;font-size:12px;color:var(--mut);white-space:pre-wrap}
:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
</style></head><body>
<header><b>Scalper</b><span class=tag id=env>-</span><span class=tag id=conn>offline</span><button id=btnConn>Connect</button></header>

<section class=grid>
 <div><span>Wallet</span><b class=num id=wallet>-</b></div><div><span>Available</span><b class=num id=avail>-</b></div>
 <div><span>Margin balance</span><b class=num id=margin>-</b></div><div><span>Unrealized PnL</span><b class=num id=upnl>-</b></div>
 <div><span>Today net PnL</span><b class=num id=dpnl>-</b></div><div><span>Today wins / losses</span><b class=num id=wl>-</b></div>
</section>

<button id=arm>Auto-trading OFF</button>

<section><form id=f>
 <div><label>Network</label><select name=env><option>testnet</option><option>mainnet</option></select></div>
 <div><label>Timeframe</label><select name=tf><option>1m</option><option>3m</option><option>5m</option></select></div>
 <div><label>Leverage <span id=lv></span></label><input name=leverage type=range min=1 max=50></div>
 <div><label>Margin type</label><select name=margin><option>ISOLATED</option><option>CROSSED</option></select></div>
 <div><label>Risk per trade %</label><input name=risk_pct type=number step=0.1></div>
 <div><label>Max open positions</label><input name=max_pos type=number></div>
 <div><label>Stop-loss (x ATR)</label><input name=sl_atr type=number step=0.1></div>
 <div><label>Take-profit (x ATR)</label><input name=tp_atr type=number step=0.1></div>
 <div class=w><label>Pairs: TOP50 or comma list (BTCUSDT,ETHUSDT)</label><input name=symbols></div>
 <button class=w type=submit>Save settings</button>
</form></section>

<section><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>Open positions</b><button id=all>Close all</button></div>
<div class=scroll><table><thead><tr><th>Pair<th>Size<th>Entry<th>Mark<th>Liq<th>PnL<th>%<th></thead><tbody id=pos></tbody></table></div></section>

<section><pre id=log></pre></section>

<script>
let T=localStorage.t||prompt("Dashboard token")||"";localStorage.t=T;
const $=i=>document.getElementById(i),n=(x,d=2)=>Number(x).toFixed(d),sg=x=>x>=0?"up":"dn";
const api=(p,b)=>fetch("/api/"+p,{method:"POST",headers:{"x-token":T,"content-type":"application/json"},body:JSON.stringify(b||{})})
 .then(r=>{if(r.status==401){localStorage.removeItem("t");location.reload()}if(!r.ok)throw r.status;return r.json()});
let S={},filled=false;
function put(id,v,c){const e=$(id);e.textContent=v;if(c)e.className="num "+c}
function render(s){
 S=s;$("env").textContent=s.cfg.env;$("env").className="tag "+(s.cfg.env=="mainnet"?"live":"");
 $("conn").textContent=s.connected?"connected":"offline";$("conn").className="tag "+(s.connected?"on":"");
 put("wallet",n(s.wallet||0));put("avail",n(s.avail||0));put("margin",n(s.margin||0));
 put("upnl",n(s.upnl||0),sg(s.upnl||0));put("dpnl",n(s.day.pnl),sg(s.day.pnl));put("wl",s.day.w+" / "+s.day.l);
 $("arm").className=s.auto?"on":"";$("arm").textContent=s.auto?"Auto-trading ON - tap to stop":"Auto-trading OFF - tap to start";
 if(!filled){filled=true;for(const [k,v] of Object.entries(s.cfg)){const e=$("f").elements[k];if(e)e.value=v}$("lv").textContent=s.cfg.leverage+"x"}
 $("pos").innerHTML=(s.positions||[]).map(p=>`<tr><td>${p.s}<td>${p.amt}<td>${p.entry}<td>${p.mark}<td>${p.liq}<td class=${sg(p.pnl)}>${n(p.pnl)}<td class=${sg(p.roe)}>${n(p.roe,1)}%<td><button onclick="api('close/${p.s}')">Close</button>`).join("")||"<tr><td colspan=8>No open positions";
}
const es=new EventSource("/api/stream?token="+encodeURIComponent(T));
es.onmessage=e=>{const d=JSON.parse(e.data);if(d.t=="state")render(d);else{const l=$("log");l.textContent+=d.m+"\n";l.scrollTop=l.scrollHeight}};
$("f").leverage.oninput=e=>$("lv").textContent=e.target.value+"x";
$("f").onsubmit=e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));
 if(b.env=="mainnet"&&!confirm("MAINNET = real money. Continue?"))return;api("config",b)};
$("btnConn").onclick=()=>api("connect");
$("arm").onclick=()=>{const on=!S.auto;if(on&&S.cfg.env=="mainnet"&&!confirm("Start auto-trading with REAL money?"))return;api("auto",{on})};
$("all").onclick=()=>confirm("Close every open position now?")&&api("closeall");
</script></body></html>
